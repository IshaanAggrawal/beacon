name: Docker image

on:
  push:
    branches: [main]
  pull_request:

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # Docker tags must be lowercase; this also adds the source label that
      # links the package to the repo.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: beacon:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run -d --name beacon -p 8080:8080 beacon:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/healthz; then break; fi
            sleep 1
          done
          curl -fsS "http://localhost:8080/api/scenario?seed=1&hostile=true&sybil=true" | grep -q '"scores"'
          curl -fsS http://localhost:8080/ | grep -q '<title>beacon'
          echo "image serves the demo"
          docker logs beacon

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
