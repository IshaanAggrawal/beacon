[package]
name = "beacon"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A Git-native trust network that keeps coordinated PR spam out without locking newcomers out."
license = "MIT"
readme = "README.md"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
thiserror = "2"

[profile.release]
lto = "thin"
