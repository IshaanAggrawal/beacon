[package]
name = "beacon"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A Git-native trust network that keeps coordinated PR spam out without locking newcomers out."
license = "MIT"
readme = "README.md"
publish = false

[dependencies]
anyhow = "1"
chrono = { version = "0.4.45", default-features = false, features = ["serde", "clock", "std"] }
clap = { version = "4", features = ["derive"] }
ed25519-dalek = "3.0.0"
getrandom = "0.4.3"
hex = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.0"
thiserror = "2"
toml = "1.2.1"

[profile.release]
lto = "thin"

[dev-dependencies]
tempfile = "3.27.0"
